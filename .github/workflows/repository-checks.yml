name: Repository integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    name: Source, Unity metadata and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository (does not compile Unity)
        run: python3 tools/validate_repository.py
      - name: Check patch whitespace
        run: git show --format= --check HEAD
